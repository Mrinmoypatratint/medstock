{% load static %}
<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#2563eb" />
  <title>MedShop Tracker</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              /* Serene Blue palette (Sky/Cyan mix) */
              50:'#f0f9ff',100:'#e0f2fe',200:'#bae6fd',300:'#7dd3fc',
              400:'#38bdf8',500:'#0ea5e9',600:'#0284c7',700:'#0369a1',
              800:'#075985',900:'#0c4a6e'
            },
            accent: {
              /* Healing Green palette (Teal) */
              50:'#f0fdfa',100:'#ccfbf1',200:'#99f6e4',300:'#5eead4',
              400:'#2dd4bf',500:'#14b8a6',600:'#0d9488',700:'#0f766e',
              800:'#115e59',900:'#134e4a'
            }
          }
        }
      }
    }
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Custom CSS -->
  <style>
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial;
    }
  </style>
  <link href="{% static 'css/app.css' %}" rel="stylesheet">
</head>

<body class="h-full app-bg text-slate-800">
  {% include 'navbar.html' %}

  <main class="max-w-7xl mx-auto px-3 sm:px-6 pb-8 pt-4 sm:pt-6">
    <div class="page-shell space-y-4">
      {% for message in messages %}
        <div class="mb-2 rounded-2xl border border-white/60 bg-white/80 px-4 py-3 text-sm shadow-sm
          {% if message.tags == 'success' %}text-emerald-800{% endif %}
          {% if message.tags == 'error' %}text-red-700{% endif %}
          {% if message.tags == 'warning' %}text-amber-800{% endif %}">
          {{ message }}
        </div>
      {% endfor %}

      {% block content %}{% endblock %}
    </div>
  </main>

  <!-- AI Chat Assistant Widget -->
  <div id="aiChatWidget" class="fixed bottom-4 right-4 sm:bottom-6 sm:right-6 z-50 flex flex-col items-end">
    <!-- Chat Window (Hidden by default) -->
    <div id="aiChatWindow" class="hidden w-[calc(100vw-2rem)] sm:w-96 bg-white/95 backdrop-blur-xl rounded-2xl shadow-[0_20px_60px_rgba(15,23,42,0.15)] border border-slate-200 mb-4 overflow-hidden flex flex-col transform transition-all duration-300 scale-95 opacity-0 origin-bottom-right" style="height: 500px; max-height: calc(100vh - 110px); min-height: 300px;">
      <!-- Header -->
      <div class="bg-gradient-to-r from-brand-600 to-accent-500 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="inline-flex h-8 w-8 items-center justify-center rounded-full bg-white/20 text-white font-bold shadow-sm">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
          </span>
          <div>
            <h3 class="text-sm font-bold text-white leading-none">Smart Assistant</h3>
            <span class="text-[10px] text-brand-100">Powered by AI</span>
          </div>
        </div>
        <button id="closeAiChatBtn" class="text-white/80 hover:text-white transition">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      
      <!-- Messages Area -->
      <div id="aiChatMessages" class="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50/50">
        <div class="flex justify-start">
          <div class="bg-white border border-slate-100 shadow-sm text-slate-700 rounded-2xl rounded-tl-sm px-4 py-2.5 text-sm max-w-[85%]">
            Hello! I'm your MedShop Smart Assistant. Ask me about your inventory, expiring medicines, or recent sales.
          </div>
        </div>
      </div>
      
      <!-- Input Area -->
      <div class="p-3 bg-white border-t border-slate-100">
        <form id="aiChatForm" class="flex items-center gap-2">
          <input type="text" id="aiChatInput" placeholder="Ask about your inventory..." class="flex-1 rounded-full border-slate-200 bg-slate-50 px-4 py-2 text-sm focus:border-brand-500 focus:bg-white focus:ring-brand-500 transition-colors outline-none" required autocomplete="off">
          <button type="submit" class="inline-flex h-9 w-9 items-center justify-center rounded-full bg-brand-600 text-white shadow-sm hover:bg-brand-700 transition-colors flex-shrink-0">
            <svg class="h-4 w-4 transform rotate-90" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
            </svg>
          </button>
        </form>
      </div>
    </div>

    <!-- Toggle Button -->
    <button id="toggleAiChatBtn" class="group flex h-14 w-14 items-center justify-center rounded-full bg-gradient-to-tr from-brand-600 to-accent-500 text-white shadow-lg hover:shadow-xl transition-all hover:-translate-y-1">
      <svg class="h-7 w-7 transition-transform group-hover:scale-110" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
      </svg>
    </button>
  </div>

  <!-- Scripts -->
  <script src="{% static 'js/app.js' %}"></script>
  <script src="{% static 'js/ai_chat.js' %}"></script>
</body>
</html>
