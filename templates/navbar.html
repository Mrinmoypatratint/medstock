<nav class="sticky top-0 z-50 border-b border-white/70 bg-white/80 backdrop-blur-xl shadow-[0_10px_30px_rgba(15,23,42,0.06)] supports-[backdrop-filter]:bg-white/75">
  <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-3 sm:px-6 lg:px-8">
    <div class="flex items-center gap-3">
      <a href="/" class="inline-flex items-center gap-2 rounded-full border border-brand-100 bg-gradient-to-r from-brand-600 to-cyan-500 px-2.5 py-1.5 text-white shadow-sm">
        <span class="inline-flex h-8 w-8 items-center justify-center rounded-full bg-white/20 font-bold">M</span>
        <span class="flex flex-col leading-none">
          <span class="text-sm font-semibold">MedShop</span>
          <span class="text-[10px] font-medium text-white/80">Inventory Hub</span>
        </span>
      </a>

      {% if user.is_authenticated %}
      <div class="hidden md:flex items-center gap-1 rounded-full bg-slate-100/70 p-1">
        <a href="/" class="rounded-full px-3 py-1.5 text-sm font-medium text-slate-700 transition hover:bg-white {% if request.path == '/' %}bg-white text-brand-700 shadow-sm{% endif %}">Dashboard</a>
        <a href="{% url 'inventory:generate_bill' %}" class="rounded-full px-3 py-1.5 text-sm font-medium text-slate-700 transition hover:bg-white {% if '/billing' in request.path or '/bill' in request.path %}bg-white text-brand-700 shadow-sm{% endif %}">Billing</a>
        <a href="/reports/" class="rounded-full px-3 py-1.5 text-sm font-medium text-slate-700 transition hover:bg-white {% if request.path|slice:':9' == '/reports/' %}bg-white text-brand-700 shadow-sm{% endif %}">Reports</a>
        <a href="/records/" class="rounded-full px-3 py-1.5 text-sm font-medium text-slate-700 transition hover:bg-white {% if request.path|slice:':8' == '/records' %}bg-white text-brand-700 shadow-sm{% endif %}">Records</a>
        <a href="/manufacturers/" class="rounded-full px-3 py-1.5 text-sm font-medium text-slate-700 transition hover:bg-white {% if request.path|slice:':15' == '/manufacturers' %}bg-white text-brand-700 shadow-sm{% endif %}">Manufacturers</a>
      </div>
      {% endif %}
    </div>

    <div class="flex items-center gap-2">
      {% if user.is_authenticated %}
      <div class="hidden md:flex items-center gap-2">

        <a href="/accounts/profile/" class="rounded-full bg-slate-100 px-3 py-1.5 text-sm font-medium text-slate-700 transition hover:bg-slate-200">Profile</a>
        <a href="/accounts/logout/" class="rounded-full bg-red-50 px-3 py-1.5 text-sm font-medium text-red-700 transition hover:bg-red-100">Logout</a>
      </div>
      <button id="mobileMenuBtn" class="inline-flex items-center justify-center rounded-full border border-slate-200 bg-white p-2 text-slate-600 shadow-sm hover:bg-slate-100 hover:text-slate-900 md:hidden" aria-expanded="false">
        <span class="sr-only">Open main menu</span>
        <svg id="menuIconOpen" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
        <svg id="menuIconClose" class="hidden h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
      {% endif %}
    </div>
  </div>

  {% if user.is_authenticated %}
  <div id="mobileMenu" class="hidden border-t border-slate-200 bg-white/90 px-3 py-3 md:hidden">
    <div class="space-y-1 rounded-2xl bg-slate-50 p-2">
      <a href="/" class="block rounded-xl px-3 py-2 text-base font-medium text-slate-700 hover:bg-white {% if request.path == '/' %}bg-white text-brand-700{% endif %}">Dashboard</a>
      <a href="{% url 'inventory:generate_bill' %}" class="block rounded-xl px-3 py-2 text-base font-medium text-slate-700 hover:bg-white {% if '/billing' in request.path or '/bill' in request.path %}bg-white text-brand-700{% endif %}">Billing</a>
      <a href="/reports/" class="block rounded-xl px-3 py-2 text-base font-medium text-slate-700 hover:bg-white {% if request.path|slice:':9' == '/reports/' %}bg-white text-brand-700{% endif %}">Reports</a>
      <a href="/records/" class="block rounded-xl px-3 py-2 text-base font-medium text-slate-700 hover:bg-white {% if request.path|slice:':8' == '/records' %}bg-white text-brand-700{% endif %}">Records</a>
      <a href="/manufacturers/" class="block rounded-xl px-3 py-2 text-base font-medium text-slate-700 hover:bg-white {% if request.path|slice:':15' == '/manufacturers' %}bg-white text-brand-700{% endif %}">Manufacturers</a>
      <a href="/accounts/profile/" class="block rounded-xl px-3 py-2 text-base font-medium text-slate-700 hover:bg-white">Profile</a>

      <a href="/accounts/logout/" class="block rounded-xl px-3 py-2 text-base font-medium text-red-700 hover:bg-red-50">Logout</a>
    </div>
  </div>
  {% endif %}
</nav>
