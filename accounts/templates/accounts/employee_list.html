{% extends 'base.html' %}
{% block content %}
<div class="mx-auto max-w-5xl">
  <div class="mb-6 flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-semibold text-slate-900">Manage Employees</h1>
      <p class="text-sm text-slate-500">Add staff accounts that share your shop's inventory.</p>
    </div>
    <a href="{% url 'accounts:add_employee' %}" class="inline-flex items-center gap-2 rounded-xl bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-brand-700 transition">
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
      Add Employee
    </a>
  </div>

  <div class="glass-panel rounded-2xl overflow-hidden">
    <table class="min-w-full divide-y divide-slate-200 text-left text-sm">
      <thead class="bg-slate-50/50">
        <tr>
          <th class="px-6 py-3 font-semibold text-slate-900">Name</th>
          <th class="px-6 py-3 font-semibold text-slate-900">Email</th>
          <th class="px-6 py-3 font-semibold text-slate-900">Status</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-100 bg-white/50">
        {% for emp in employees %}
        <tr>
          <td class="px-6 py-4 font-medium text-slate-900">{{ emp.full_name }}</td>
          <td class="px-6 py-4 text-slate-600">{{ emp.user.email }}</td>
          <td class="px-6 py-4">
            <span class="inline-flex rounded-full bg-green-50 px-2 py-1 text-xs font-semibold text-green-700">Active</span>
          </td>
        </tr>
        {% empty %}
        <tr>
          <td colspan="3" class="px-6 py-8 text-center text-slate-500">No employees added yet.</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
