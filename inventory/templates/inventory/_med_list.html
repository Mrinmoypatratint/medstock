{% for m in meds %}
<a href="#" data-detail-url="{% url 'inventory:medicine_detail_partial' m.pk %}"
   class="flex items-center justify-between p-3 sm:p-4 hover:bg-slate-50 transition-colors">
  <div class="min-w-0 flex-1">
    <div class="font-medium text-slate-900 truncate">{{ m.name }}</div>
    <div class="text-xs text-slate-500 mt-0.5">ID: {{ m.medicine_id }} · Qty: {{ m.quantity_on_hand }}</div>
  </div>
  <div class="ml-3 flex-shrink-0">
    {% if m.expiry_status == 'expired' %}
      <span class="inline-flex items-center rounded-full bg-red-100 text-red-700 text-xs px-2 py-0.5">Expired</span>
    {% elif m.expiry_status == 'expiring' %}
      <span class="inline-flex items-center rounded-full bg-amber-100 text-amber-800 text-xs px-2 py-0.5">Expiring</span>
    {% else %}
      <span class="inline-flex items-center rounded-full bg-emerald-100 text-emerald-700 text-xs px-2 py-0.5">OK</span>
    {% endif %}
  </div>
</a>
{% empty %}
<div class="p-6 text-center">
  <svg class="mx-auto h-12 w-12 text-slate-300 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
  </svg>
  <p class="text-slate-500">No medicines yet.</p>
  <a class="text-brand-700 hover:underline text-sm" href="{% url 'inventory:records' %}">Add some in Records →</a>
</div>
{% endfor %}
