{% extends 'base.html' %}
{% block content %}
<div class="flex flex-col lg:flex-row gap-6">
  <!-- Mobile Toggle for Filter Pane -->
  <div class="lg:hidden mb-2">
    <button id="toggleFilterBtn" class="inline-flex items-center gap-2 px-3 py-2 rounded-lg bg-white shadow text-sm font-medium text-slate-700 hover:bg-slate-50">
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
      </svg>
      Show Expiry Overview
    </button>
  </div>

  <aside id="filterPane" class="lg:w-64 w-full hidden lg:block">
    <div class="bg-white shadow rounded-xl p-4">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-semibold text-slate-700">Expiry Overview</h2>
        <button id="closeFilterBtn" class="lg:hidden p-1 rounded hover:bg-slate-100">
          <svg class="h-5 w-5 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <ul class="mt-3 space-y-2 text-sm">
        <li>
          <a href="{% url 'inventory:medicines' %}?status=expired" class="flex items-center justify-between p-2 -mx-2 rounded-lg hover:bg-red-50 transition-colors">
            <span class="text-slate-700">Expired</span>
            <span class="inline-flex items-center rounded-full bg-red-100 text-red-700 text-xs px-2 py-0.5">{{ expired_count }}</span>
          </a>
        </li>
        <li>
          <a href="{% url 'inventory:medicines' %}?status=expiring" class="flex items-center justify-between p-2 -mx-2 rounded-lg hover:bg-amber-50 transition-colors">
            <span class="text-slate-700">Expiring ≤30d</span>
            <span class="inline-flex items-center rounded-full bg-amber-100 text-amber-800 text-xs px-2 py-0.5">{{ expiring_count }}</span>
          </a>
        </li>
        <li>
          <a href="{% url 'inventory:medicines' %}?status=ok" class="flex items-center justify-between p-2 -mx-2 rounded-lg hover:bg-emerald-50 transition-colors">
            <span class="text-slate-700">OK</span>
            <span class="inline-flex items-center rounded-full bg-emerald-100 text-emerald-700 text-xs px-2 py-0.5">{{ ok_count }}</span>
          </a>
        </li>
      </ul>
      <a href="{% url 'inventory:medicines' %}" class="mt-4 inline-flex text-sm text-brand-700 hover:underline">Open full list →</a>
    </div>
  </aside>

  <section class="flex-1 min-w-0">
    <form class="flex flex-col sm:flex-row gap-2 mb-4" method="get">
      <input class="flex-1 rounded-lg border-slate-300 focus:border-brand-500 focus:ring-brand-500" type="search" name="q" value="{{ q }}" placeholder="Search by name or ID" />
      <button class="inline-flex justify-center items-center rounded-lg bg-brand-600 px-4 py-2 text-white hover:bg-brand-700 whitespace-nowrap">Search</button>
    </form>

   <div id="medList" class="bg-white shadow rounded-xl divide-y max-h-[60vh] lg:max-h-[70vh] overflow-y-auto">
  {% include 'inventory/_med_list.html' with meds=meds %}
</div>

  </section>

  <aside class="lg:w-80 w-full">
    <div id="detailPane" class="bg-white shadow rounded-xl min-h-[240px]">
      <div class="p-4 text-slate-500 text-center">
        <svg class="mx-auto h-12 w-12 text-slate-300 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
        <p>Click a medicine to see details here.</p>
      </div>
    </div>
  </aside>
</div>

<script>
  // Mobile filter toggle
  document.getElementById('toggleFilterBtn')?.addEventListener('click', () => {
    document.getElementById('filterPane')?.classList.remove('hidden');
  });
  document.getElementById('closeFilterBtn')?.addEventListener('click', () => {
    document.getElementById('filterPane')?.classList.add('hidden');
  });
</script>
{% endblock %}
